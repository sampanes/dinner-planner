# The phone app (apps/dinner_planner): analyze and test on every change to
# it, then build the APK, sign it with the app's one key and attach it to a
# GitHub release, which is where a phone (or Obtainium) picks it up.
#
# A release is made once per version: when a push to main carries a version
# in pubspec.yaml that has no "app-v<version>" release yet. Pushing such a tag
# by hand, or running this workflow from the Actions page, does the same. So
# it does not matter which computer the change came from: every APK is built
# here and signed with the same key.
#
# Signing needs four repository secrets: ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# (apps/dinner_planner/tool/signing_setup.py makes the key and sets them).
# Until they are set the release job says so and makes nothing.
name: Phone app

on:
  push:
    branches: [main]
    tags: ["app-v*"]
    paths:
      - "apps/dinner_planner/**"
      - "data/runtime/recipes.runtime.json"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "apps/dinner_planner/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dinner_planner
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned Flutter version
        id: pin
        run: echo "version=$(python3 -c 'import json; print(json.load(open(".fvmrc"))["flutter"])')" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.pin.outputs.version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  release:
    name: Signed APK
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/dinner_planner
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether this version still needs a release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/app-v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="app-v$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$tag" = "app-v" ]; then
            echo "::error::No version found in pubspec.yaml."
            exit 1
          elif gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::$tag is already released. Raise the version in pubspec.yaml to make a new one."
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ "$HAS_KEY" != "true" ]; then
            echo "::warning::No signing key yet, so no APK was made for $tag. Run apps/dinner_planner/tool/signing_setup.py once (apps/dinner_planner/README.md, \"Installing and updating\")."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Read the pinned Flutter version
        if: steps.plan.outputs.go == 'true'
        id: pin
        run: echo "version=$(python3 -c 'import json; print(json.load(open(".fvmrc"))["flutter"])')" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        if: steps.plan.outputs.go == 'true'
        with:
          flutter-version: ${{ steps.pin.outputs.version }}
          channel: stable
          cache: true
      - name: Signing key from the repository secrets
        if: steps.plan.outputs.go == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - if: steps.plan.outputs.go == 'true'
        run: flutter pub get
      - if: steps.plan.outputs.go == 'true'
        run: flutter build apk --release
      - name: Publish the release
        if: steps.plan.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          apk="dinner-planner-${TAG#app-v}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          gh release create "$TAG" "$apk" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Phone app ${TAG#app-v}" \
            --notes "Android APK, signed with the app's own key. Open it on the phone to install it over the previous one."
